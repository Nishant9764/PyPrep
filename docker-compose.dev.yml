# Just MongoDB, for local development (npm run dev). Published on loopback only.
#   docker compose -f docker-compose.dev.yml up -d
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db
volumes:
  mongo-dev-data:
